# Judgement layer ("AI s modelom"): only facts the fundamentals model cannot see.
# Keys: race id -> candidates -> ascii surname (or "firstname surname") -> fields.
#   adj         log-utility shift (+0.4 ~ +40 % relative share before normalisation); always with adj_reason
#   transfer_to withdrawn candidate's endorsement: half of their poll support moves to this candidate
#   prev_share  previous result in the same office when the 2022 table does not show it
# Scale used for profile adjustments (kept coarse on purpose):
#   +0.6 former holder of the same office / heir endorsed by a long-serving outgoing mayor
#   +0.3 clear organisational advantage not captured by party count (endorsements, merged lists)
#   -0.5 no public or political profile found (no office, no previous run, no party)

# ---------- regions ----------
kraj-za:
  candidates:
    lucansky: {transfer_to: Igor Choma}
    belousovova: {transfer_to: Igor Choma}
kraj-po:
  candidates:
    leskova: {transfer_to: Milan Mazurek}
    kaso: {transfer_to: Samuel Migaľ}
kraj-ke:
  candidates:
    geci: {transfer_to: Igor Šimko}
  polls:
    - pollster: AKO (JOJ 24)
      fieldwork_end: "2026-10-12"
      n: null
      results: {Rastislav Trnka: 42.4, Marián Porvažník: 25.7, Igor Šimko: 19.7}
      source: https://joj24.noviny.sk/prieskumy/1274835-kto-ovladne-kosicky-kraj-prieskum-joj-24-ukazal-vyrazny-naskok-jedneho-z-kandidatov
      note: fieldwork dates not published; Géci (withdrew 12.10) still listed, so end date set to 12.10 (assumption); only the three leaders are used

