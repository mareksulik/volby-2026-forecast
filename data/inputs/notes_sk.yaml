kraj-ba: Úradujúci predseda Juraj Droba vyhral v roku 2022 so ziskom 63,6 % a teraz ho nominujú SaS, PS, Demokrati a Team Bratislava. Vládne strany Smer, Hlas a SNS spoločne nominovali Rastislava Gajarského, ktorý mal v prieskume 4,3 %; kandidát Smeru a SNS získal v roku 2022 13,4 %. Prieskum Politologických prieskumov z 5. októbra dáva Drobovi 68,9 % rozhodnutých voličov, druhá je Zuzana Krajčovičová (Právo na pravdu, SaNK). Stávkové kancelárie dávajú na Drobu kurz 1,01.
kraj-tt: Úradujúci predseda Jozef Viskupič vyhral v roku 2022 s 38,56 % a teraz ho nominujú PS, SaS, KDH, Demokrati, Hnutie Slovensko, Maďarské fórum a OKS. Prieskum AKO pre JOJ 24 mu dáva 51,8 % rozhodnutých voličov, József Berényi (Maďarská aliancia) má 18,1 %, nezávislý Matej Lančarič 11,7 % a Peter Hambálek (Smer, Hlas, SNS, Republika) 9,6 %. Berényi má podporu najmä medzi maďarskými voličmi, v okrese Dunajská Streda vedie s 53 % pred Viskupičom s 29 %. Politologické prieskumy dávajú tretie miesto Hambálkovi s 13,4 %.
kraj-tn: Úradujúci predseda Jaroslav Baška je vo funkcii od roku 2013 a v roku 2022 získal 67,25 %; nominujú ho Smer, Hlas, Republika a SNS. Opozičné strany PS, SaS, KDH, Demokrati, Hnutie Slovensko a OKS podporujú Natáliu Svítkovú, ostatní dvaja kandidáti sú okrajoví. Prieskum AKO dáva Baškovi 57,5 % a Svítkovej 38,6 % rozhodnutých voličov, Politologické prieskumy 56,0 % a 43,3 %. Opozičný kandidát mal v roku 2022 16,6 %. Tipsport dáva na Bašku kurz 1,08.
kraj-nr: 'Úradujúci predseda Branislav Becík (Hlas) vyhral v roku 2022 s 27,49 % a teraz ho podporujú Hlas, Smer, SNS, Republika, Právo na pravdu a Bratia Slovenska. Henrich Varga je spoločný kandidát opozície a Tímu kraj Nitra. Prieskumy sa rozchádzajú: AKO dáva Becíkovi 45,5 % a Vargovi 25,5 %, Politologické prieskumy Vargovi 38,9 % rozhodnutých; kurz Tipsportu na Vargu stúpol z 3,2 na 6,5. Poslankyňa Martina Holečková 19. októbra oznámila trestné oznámenie na Becíka pre zámenu pozemkov v Radave; ide o podozrenie, nie o obvinenie.'
kraj-za: Úradujúca predsedníčka Erika Jurinová vyhrala v rokoch 2017 (43,67 %) a 2022 (32,04 %) a nominuje ju široká opozičná koalícia vrátane PS, SaS, KDH a Demokratov. Hlavný vyzývateľ Igor Choma (Smer, Hlas, DOMOV-NS) bol v roku 2022 druhý s 22,24 %. V jeho prospech odstúpil Adam Lučanský (SNS) a 15. októbra odstúpila Anna Belousovová (Republika), aby nedelila hlasy proti Jurinovej. Septembrový prieskum AKO dával Jurinovej 48,5 %, Chomovi 17,3 %, Belousovovej 14,3 % a nezávislému Martinovi Kapitulíkovi 11,8 %. Stávkové kancelárie dávajú na Jurinovú kurz 1,10 až 1,15.
kraj-bb: Úradujúci predseda Ondrej Lunter vyhral v roku 2022 so 47,53 %. Kandiduje ako nezávislý s podporou SaS, Aliancie, Hlasu, KDH, PS a Demokratov; Smer ani SNS kandidáta nenominovali. Prieskum AKO pre JOJ 24 mu dáva 63,2 % rozhodnutých voličov, Miroslavovi Sujovi (Republika) 16,8 %, Marianovi Kotlebovi (ĽSNS) 8,6 % a Romanovi Malatincovi (Strana vidieka) 8,5 %. Suja je spájaný s kauzou techniky za 1 euro z obdobia Kotlebu, vinu popiera. Stávkové kancelárie dávajú na Luntera kurz 1,01.
kraj-po: Úradujúci predseda Milan Majerský (KDH) vyhral v rokoch 2017 (40,36 %) a 2022 (42,01 %) a nominujú ho KDH, Hnutie Slovensko, SaS, Za ľudí, Konzervatívci a PS. Kandidátka Smeru Judita Laššáková odstúpila po dohode s vedením strany a Monika Lešková (SNS) odstúpila v prospech Milana Mazureka (Republika). Zoltán Kašo odstúpil v prospech ministra Samuela Migaľa, ktorý kandiduje ako nezávislý. Prieskum AKO dáva Majerskému 49,2 %, Mazurekovi 32,4 % a Migaľovi 7,8 % rozhodnutých. Stávkové kancelárie dávajú na Majerského kurz 1,11 až 1,13.
kraj-ke: Úradujúci predseda Rastislav Trnka vyhral v roku 2022 s 51,31 % s podporou KDH a Aliancie, teraz kandiduje ako nezávislý. Opozícia vrátane KDH podporuje Mariána Porvažníka (PS), vládne strany a Republika nominujú Igora Šimka (Hlas). Prieskum AKO z 20. októbra dáva Trnkovi 42,4 %, Porvažníkovi 25,7 % a Šimkovi 19,7 % rozhodnutých. Stávkové kancelárie hodnotia Trnku a Porvažníka takmer rovnako (Tipsport 1,75 a 1,95). Trnka je obžalovaný v kauze obstarávania Valentín a vinu popiera.
mesto-bratislava: 'Primátor Matúš Vallo vyhral v roku 2022 so 60,2 % a teraz ho nominujú Team Bratislava, PS, SaS a Demokrati. Hlavný vyzývateľ, minister dopravy Jozef Ráž, kandiduje ako nezávislý, no je vnímaný ako kandidát Smeru. V jeho prospech odstúpil Martin Winkler (Dunaj) a Miroslav Heredoš odstúpil zo zdravotných dôvodov. Prieskumy sa rozchádzajú: SANEP dáva Vallovi náskok 2,6 percentuálneho bodu medzi rozhodnutými, Ixactly 14,6 bodu. Stávkové kancelárie dávajú Vallovi pravdepodobnosť výhry približne 93 až 96 %.'
mesto-kosice: Primátor Jaroslav Polaček (KDH, SaS, Maďarská aliancia a ďalší) vyhral v roku 2018 so 43,29 % a v roku 2022 s 36,8 %. Ladislav Lörinc (Košická strana), starosta Sídliska KVP, vedie v štyroch z piatich prieskumov a stávkové kancelárie ho považujú za favorita. Polaček je prvý len v prieskume agentúry Focus, ktorý si objednal jeho tím. Ďalšími kandidátmi sú Martin Mudrák (PS, Demokrati, Za ľudí) a Lenka Kovačevičová (Tím Košice, SaNK, Právo na pravdu); poradie na druhom až štvrtom mieste je v rámci štatistickej chyby. Vládne strany vlastného kandidáta nemajú.
mesto-banska-bystrica: Primátor Ján Nosko je vo funkcii od roku 2014 a v roku 2022 vyhral so 66,2 % nad Dianou Javorčíkovou (24,8 %). Kandiduje ako nezávislý, predseda Hlasu Matúš Šutaj Eštok vyjadril ochotu ho podporiť. Javorčíkovú nominujú PS, SaS, Demokrati, Hnutie Slovensko a OKS a 8. októbra v jej prospech odstúpil Tomáš Sobota, ktorého podporovalo KDH. Nosko vedie vo všetkých štyroch prieskumoch o 1,6 až 11,4 bodu, no všetky tri stávkové kancelárie považujú za miernu favoritku Javorčíkovú. Hlasy odporcov primátora delí aj Matúš Molitoris s 12 až 19 %.
mesto-nitra: 'Primátor Marek Hattas vyhral v roku 2018 so 42,28 % a v roku 2022 s 30,8 %, teraz ho okrem Tímu kraj Nitra podporuje celá parlamentná opozícia. Hlavný vyzývateľ Igor Kršiak bol v roku 2022 druhý s 27,2 % s podporou Hlasu a Sme rodiny, teraz kandiduje ako nezávislý. Vládne strany majú dvoch kandidátov: Mareka Illéša (Smer, Hlas, Sme rodina) a Zuzanu Uhríkovú (Republika, SNS). Nezávislý prieskum AKO dáva Hattasovi 55 % a Kršiakovi 32,5 %. Stávkové kancelárie dávajú Hattasovi pravdepodobnosť výhry približne 75 až 80 %.'
mesto-presov: Primátor František Oľha (PS, Demokrati, DS) vyhral v roku 2022 s 37,26 %. Pavel Hagyari, primátor v rokoch 2006 až 2014, skončil druhý v rokoch 2014, 2018 aj 2022 a teraz kandiduje ako nezávislý. Rastislava Mochnackého nominujú KDH, SaS, Hnutie Slovensko a ďalšie strany, Svetlanu Pavlovičovú Smer, SNS, Sme rodina a Bratia Slovenska; Hlas a Republika nepodporili nikoho. Prieskum NMS, ktorý zverejnil Oľhov tím, mu dáva 46 %, Hagyarimu 30 % a Mochnackému 11 %. Stávkové kancelárie dávajú na Oľhu kurz 1,08 až 1,10 a Tipsport aj Polymarket uvádzajú ako druhého Mochnackého.
mesto-trnava: Primátor Peter Bročka po troch obdobiach nekandiduje; v roku 2022 porazil Branislava Baroša (Trnava pre každého, KDH), ktorý získal 33,62 %. Viceprimátorku Evu Nemčovskú podporujú PS a od 9. októbra aj Demokrati, ktorých kandidátka Ľubica Horváthová v jej prospech odstúpila. Prieskum Trnavskej univerzity pred odstúpením dával Barošovi 32,4 %, Nemčovskej 31,9 % a Horváthovej 12,4 %. Stávkové kancelárie považujú za favoritku Nemčovskú (kurz 1,45 až 1,65 oproti 1,90 až 2,45 pre Baroša). Martin Pullmann je kandidátom Smeru, Hlasu, SNS a Republiky.
mesto-trencin: Primátor Richard Rybníček po 16 rokoch nekandiduje a podporuje svojho prvého viceprimátora Jána Forgáča. Hlavný vyzývateľ Miloš Mičega bol v rokoch 2018 a 2022 druhý s 27,32 % a 27,05 %. Danica Birošová, ktorá v rokoch 2018 a 2022 odstúpila v prospech Mičegu, tentoraz podľa vlastných slov neodstúpi. Všetci štyria kandidáti sú nezávislí a žiadna strana nikoho nenominovala. Stávkové kancelárie dávajú na Forgáča kurz 1,10 až 1,19 a na Mičegu 4,0 až 6,0.
mesto-zilina: Primátor Peter Fiabáne vyhral v rokoch 2018 (48,06 %) a 2022 (45,53 %), kandiduje ako nezávislý s podporou PS, SaS, KDH a Demokratov a uviedol, že ide o jeho poslednú kandidatúru. Hlavnými vyzývateľmi sú chirurg a krajský poslanec Rastislav Johanes a Peter Cibulka, ktorý bol v roku 2022 tretí s 15,51 %. Hlas, Smer, SNS a Domov kandidáta na primátora nemajú, Republika nominovala Michala Mila. Kurz na Fiabáneho sa od augusta zmenil z 1,04 na 1,18 až 1,20 a na Johanesa zo 7,0 na 3,8 až 4,0.
mc-stare-mesto: Starosta Matej Vagač (PS, Team Bratislava, SaS, Demokrati) vyhral v roku 2022 s 50,30 %. Bývalá starostka Zuzana Aufrichtová (Krajina, KDH, KÚ, Nova) bola vtedy druhá s 22,23 % a teraz ju podporuje aj strana Dunaj, ktorej kandidát v jej prospech odstúpil. Hlasy kritikov primátora Matúša Valla delí aj Petra Hitková (SaNK), Miroslav Vetrík kandiduje za Smer, Hlas a SNS. Aufrichtová podala podnet na prokuratúru pre Vagačov postup pri koncesnej zmluve na diaľkové vykurovanie; ide o jej tvrdenie.
mc-ruzinov: Starosta Martin Chren (Tím Ružinov) vyhral v roku 2018 s 34,21 % a v roku 2022 so 78,13 %. Koalícia Team Bratislava, PS, SaS a Demokrati proti nemu kandidáta nepostavila a deklaruje spoluprácu, kandidáta nemá ani žiadna vládna strana. Vyzývateľmi sú nezávislí Peter Strapák, ktorý bol v roku 2022 druhý s 10,93 %, a Ivor Švihran, ktorý mal v roku 2022 3,73 %.
mc-vrakuna: Starosta Martin Kuruc je vo funkcii od roku 2014, v roku 2018 získal 94,19 % a v roku 2022 nemal protikandidáta. Prvýkrát kandiduje s nomináciou strán Team Bratislava, PS, SaS a Demokrati, predtým kandidoval ako nezávislý. Protikandidátmi sú Dušan Burdy (Právo na pravdu) a Katarína Lukáčová (DS-ODS).
mc-podunajske-biskupice: Starosta Roman Lamoš (Team Bratislava, PS, SaS, Demokrati) vyhral v roku 2022 so 44,82 %. Martinu Frőhlich Činovskú nominujú SaNK, KDH, Nova a Maďarská aliancia; v roku 2022 bola tretia s 9,34 % a na jej kandidátke do zastupiteľstva je bývalý starosta Zoltán Pék, ktorý bol v roku 2022 druhý s 21,8 %. Ladislav Méry kandiduje za stranu Dunaj. Lamoš 15. októbra podal trestné oznámenie po tom, čo pod autom našiel sledovacie zariadenie GPS, a polícia začala trestné stíhanie pre nebezpečné prenasledovanie.
mc-nove-mesto: Starosta Matúš Čupka (Team Bratislava, PS, SaS, Demokrati) vyhral v roku 2022 s 55,39 %. Hlavný vyzývateľ Rudolf Kusý, bývalý starosta (do roku 2022), ho v roku 2018 porazil pomerom 58,49 % ku 37,54 %. Podľa Bratislavského Večerníka Kusý čelí obvineniu z úplatkárstva vo výške 150 000 eur a stratil podporu strany Dunaj. Tomáš Čajda (SaNK) 1. októbra odstúpil a nikoho nepodporil.
mc-raca: Starosta Michal Drotován (nezávislý) vyhral v roku 2018 so 43,45 % a v roku 2022 so 68,56 %. Jediným protikandidátom je Ján Polakovič (Spoločný cieľ), ktorý bol v roku 2022 druhý s 25,85 %. Kandidujú teda tí istí dvaja ako v roku 2022, tentoraz bez ďalších kandidátov.
mc-vajnory: Starosta Michal Vlček (nezávislý) vyhral v roku 2018 s 50,90 % a v roku 2022 so 61,10 %. Koalícia Team Bratislava, PS, SaS a Demokrati proti nemu kandidáta nepostavila. Juraj Ondruška bol v roku 2018 druhý so 43,92 % a v roku 2022 tretí s 18,47 %. Tretím kandidátom je nováčik Juraj Zeman; obaja vyzývatelia kandidujú ako nezávislí a delia si hlasy odporcov starostu.
mc-karlova-ves: Starostka Dana Čahojová, ktorá vyhrala v roku 2018 s 69,0 % a v roku 2022 s 85,5 %, nekandiduje a podporuje svojho zástupcu Branislava Záhradníka (SaNK). Martina Viciana nominujú Team Bratislava, PS, SaS a Demokrati a osobne ho podporuje primátor Matúš Vallo. Kandidujú len títo dvaja. Čahojová je v dlhodobom spore s klubom Team Bratislava v miestnom zastupiteľstve, ktorý vedie Vician.
mc-dubravka: Starosta Martin Zaťovič (Som Slovensko) je jediným kandidátom, takže voľbu vyhrá. V roku 2018 získal 90,78 % a v roku 2022 81,04 %.
mc-lamac: Starosta Igor Polakovič (Team Bratislava, PS, SaS, Demokrati) vyhral v roku 2022 s 39,34 % spomedzi štyroch kandidátov. Jedinou protikandidátkou je nezávislá Mária Šimončičová, ktorá bola v roku 2022 štvrtá s 12,91 %. Bývalý starosta Baňacký (30,02 %) ani kandidát Hlasu, Smeru a SNS Olekšák (17,72 %) tentoraz nekandidujú, takže približne 48 % hlasov z roku 2022 nemá vlastného kandidáta.
mc-devin: Starostka Jana Jakubkovič po jednom období nekandiduje. Igor Prieložný (Team Bratislava, PS, SaS, Demokrati) bol v roku 2022 druhý s 30,10 % a je jediným kandidátom s výsledkom z minulých volieb. Martin Galát je zástupcom starostky a kandiduje ako nezávislý; nie je známe, či ho Jakubkovič podporila. Tretím kandidátom je nezávislý podnikateľ Pavol Maruščák.
mc-devinska-nova-ves: Starosta Dárius Krajčír (Som Slovensko) vyhral v roku 2018 s 50,67 % a v roku 2022 so 79,93 %. Proti nemu kandidujú nezávislý Ľuboš Krajčír s rovnakým priezviskom a Denis Ružovič (Strana vidieka), ktorý mal v roku 2018 4,76 %. Kandidáta nemá koalícia primátora Matúša Valla ani Smer či Hlas.
mc-zahorska-bystrica: Starosta Jozef Krúpa (Som Slovensko) je jediným kandidátom, takže voľbu vyhrá. V roku 2018 získal 60,61 % a v roku 2022 84,88 %.
mc-petrzalka: Starosta Ján Hrčka vyhral v roku 2022 so 77,19 %, v roku 2025 sa vzdal mandátu po sprenevere približne 2,7 milióna eur zamestnancom miestneho úradu a v doplňujúcich voľbách ho obhájil so 78,58 %. Teraz kandiduje za novú stranu Krajina, ktorú podporujú aj predstavitelia KDH, KÚ, Za ľudí a NOVA. Prvýkrát proti nemu stojí kandidát koalície Team Bratislava, PS, SaS a Demokrati, politológ Daniel Klimovský. Tretím kandidátom je Juraj Mravec, ktorého Hrčka porazil v roku 2025.
mc-jarovce: Starosta Jozef Uhler (nezávislý) je jediným kandidátom, takže voľbu vyhrá. V roku 2018 získal 71,40 % a v roku 2022 nemal protikandidáta.
mc-rusovce: Starosta Radovan Jenčík (nezávislý) je jediným kandidátom, takže voľbu vyhrá. V roku 2022 získal 59,96 % proti vtedajšej starostke Lucii Tulekovej Henčelovej, ktorá teraz kandiduje len do miestneho zastupiteľstva.
mc-cunovo: 'Starostka Gabriela Ferenčáková (Som Slovensko) vyhrala v roku 2018 s 63,01 % a v roku 2022 so 71,09 %. Proti nej kandidujú štyria nezávislí: Ivan Boška, Marek Kausich, Marián Krist a Michal Šimunek. Výsledok z minulých volieb má len Krist, ktorý bol v roku 2018 druhý s 36,98 %. Pri relatívnej väčšine rozdelenie hlasov medzi štyroch vyzývateľov pomáha starostke.'
