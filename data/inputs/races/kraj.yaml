  notes: 'Úradujúci predseda Branislav Becík (Hlas) vyhral v roku 2022 s 27,49 % a teraz ho podporujú Hlas, Smer, SNS, Republika, Právo na pravdu
    a Bratia Slovenska. Henrich Varga je spoločný kandidát opozície a Tímu kraj Nitra. Prieskumy sa rozchádzajú: AKO dáva Becíkovi 45,5 % a Vargovi
    25,5 %, Politologické prieskumy Vargovi 38,9 % rozhodnutých; kurz Tipsportu na Vargu stúpol z 3,2 na 6,5. Poslankyňa Martina Holečková 19.
    októbra oznámila trestné oznámenie na Becíka pre zámenu pozemkov v Radave; ide o podozrenie, nie o obvinenie.'
