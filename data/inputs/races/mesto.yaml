    strany majú dvoch kandidátov: Mareka Illéša (Smer, Hlas, Sme rodina) a Zuzanu Uhríkovú (Republika, SNS). Nezávislý prieskum AKO dáva Hattasovi
    55 % a Kršiakovi 32,5 %. Stávkové kancelárie dávajú Hattasovi pravdepodobnosť výhry približne 75 až 80 %.'
