  notes: 'Primátor Matúš Vallo vyhral v roku 2022 so 60,2 % a teraz ho nominujú Team Bratislava, PS, SaS a Demokrati. Hlavný vyzývateľ, minister
    dopravy Jozef Ráž, kandiduje ako nezávislý, no je vnímaný ako kandidát Smeru. V jeho prospech odstúpil Martin Winkler (Dunaj) a Miroslav Heredoš
    odstúpil zo zdravotných dôvodov. Prieskumy sa rozchádzajú: SANEP dáva Vallovi náskok 2,6 percentuálneho bodu medzi rozhodnutými, Ixactly 14,6
    bodu. Stávkové kancelárie dávajú Vallovi pravdepodobnosť výhry približne 93 až 96 %.'
